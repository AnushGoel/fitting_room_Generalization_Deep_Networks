[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitting-room"
version = "1.0.0"
description = "A controlled study of how initialization, L2, dropout, and early stopping shape generalization in a fixed dense network on Fashion-MNIST."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anush Goel" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "pillow>=10"]

[project.optional-dependencies]
train = ["tensorflow>=2.16", "scikit-learn>=1.3"]
notebook = ["tensorflow>=2.16", "scikit-learn>=1.3", "scipy>=1.11", "matplotlib>=3.8", "seaborn>=0.13", "optuna>=3.5", "jupyter"]
app = ["streamlit>=1.50", "plotly>=5.18"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fitting-room = "fitting_room.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E702", "E731", "B023"]
